name: Refresh HAWK 6 TLEs

on:
  schedule:
    # Every 6 hours (CelesTrak typically updates a few times per day).
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data/hawk6.json
        run: python scripts/refresh_tles.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain data/hawk6.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/hawk6.json
            git commit -m "chore: refresh HAWK 6 TLEs from CelesTrak"
            git push
          else
            echo "No TLE changes."
          fi
